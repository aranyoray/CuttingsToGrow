name: CuttingsToGrow
options:
  bundleIdPrefix: com.cuttingstogrow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  CuttingsToGrow:
    type: application
    platform: iOS
    sources:
      - CuttingsToGrow
    settings:
      base:
        # Info.plist is generated from these keys (modern, no loose Info.plist file).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Cuttings Garden"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Usage strings for capabilities used across the phases (camera/photos in
        # Phases 2–3, location for the Swap Map in Phase 4).
        INFOPLIST_KEY_NSCameraUsageDescription: "Cuttings Garden uses the camera to photograph a plant so it can identify it and show where to cut."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photos are used to identify plants and to track the root growth of your cuttings."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location shows nearby cutting swaps on the local Swap Map."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.cuttingstogrow.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
